name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify packaged research artifacts
        run: python verify_repository.py
