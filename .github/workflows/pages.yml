name: Publish ADAP research
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble public research page
        run: |
          mkdir -p _site/results _site/reconstruction
          cp index.html demo.html paper.html paper.md REPORT.html SHA256SUMS social-preview.png _site/
          cp results/*.svg results/*.csv _site/results/
          cp reconstruction/Minier_EEG_Parts.json _site/reconstruction/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
